[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (common mistakes)
]
ignore = [
    "E501"  # ignore line length (Black handles it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
